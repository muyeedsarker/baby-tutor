%;top:8%;font-size:42px}.rground{position:absolute;right:6%;bottom:7%;font-size:65px}.note{margin:16px 0;padding:13px;border-radius:14px;background:#fff4d9;text-align:center;font-size:14px;line-height:1.6}.stop{display:block;margin:12px auto;border:0;border-radius:16px;padding:10px 18px;background:#b72b2f;color:#fff;font-weight:900}@media(max-width:560px){.header{height:105px}.headtitle{font-size:26px}.grid{padding:13px;gap:17px 14px}.cover{height:215px}.big{font-size:78px}.coverText{width:61%}.coverText h2{font-size:17px}.author,.summary{font-size:10px}.label{min-height:76px;font-size:19px}.rcover{min-height:540px}.rtext{width:62%}.rtext h1{font-size:27px}.rtext h3{font-size:14px}.rtext p{font-size:16px;line-height:1.7}.rbig{font-size:105px}}</style></head><body><div class="app"><header class="header"><a class="back" href="index.html">←</a><div class="headtitle">মজার ছড়া</div><div class="share">⌯</div></header><div class="sub">📚 পাঠ্যবই ও প্রচলিত শিশু-কবিতার অ্যালবাম</div><section class="grid" id="grid"></section></div><div class="reader" id="reader"><header class="rhead"><button class="close" onclick="closeReader()">←</button><div class="rtitle" id="rtitle"></div><button class="listen" onclick="speak()">🔊 শুনি</button></header><div class="rbody"><div class="poster"><div class="rcover" id="rcover"><div class="rcloud">☁️ ☁️</div><div class="rsun" id="rsky"></div><div class="rbig" id="rbig"></div><div class="rground" id="rground"></div><div class="rbirds">🕊️ 🐦 🕊️</div><div class="rriver"></div><div class="rtrees">🌳 🌴 🌳</div><div class="rtext"><h1 id="rt"></h1><h3 id="ra"></h3><p id="rs"></p><div class="sceneCaption" id="rcap"></div></div></div></div><div class="note">ℹ️ এখানে কবিতার নাম, কবির নাম ও পাঠের পরিচিতি দেওয়া হয়েছে। পূর্ণ মূল কবিতার পাঠ্যবই ব্যবহার করুন।</div><button class="stop" onclick="stop()">⏹ থামি</button></div></div><script>
const poems=[["হাসি","রোকনুজ্জামান খান","প্রকৃতি ও প্রাণী","🌿","🐦","🌸","শাপলা, সবুজ ঘাস, মাছ ও পাখির হাসির আনন্দময় শিশুতোষ ছড়া।"],["জন্মভূমি","রবীন্দ্রনাথ ঠাকুর","দেশ ও প্রকৃতি","🌳","🌙","🌾","নিজ জন্মভূমির আলো, ফুল, আকাশ ও মাটির প্রতি ভালোবাসার কবিতা।"],["একুশের কবিতা","আল মাহমুদ","দেশ ও ভাষা","🌺","🕊️","🌿","ভাষা আন্দোলনের স্মৃতি, শহিদদের ত্যাগ ও বাংলা ভাষার প্রতি ভালোবাসা।"],["লিচু চোর","কাজী নজরুল ইসলাম","মজার ছড়া","🍒","☁️","🌳","লিচু বাগান, দুষ্টুমি ও মজার ঘটনার ছন্দময় শিশুতোষ কবিতা।"],["আয় আয় চাঁদ মামা","প্রচলিত বাংলা ছড়া","চাঁদ ও প্রকৃতি","🌙","⭐","🌾","চাঁদকে ঘিরে বাংলার পরিচিত লোকছড়া; লেখক নির্দিষ্ট নয়।"],["ভয় পেয়ো না","সুকুমার রায়","মজার ছড়া","🐂","☁️","🌿","মজার প্রাণী-চরিত্রের কথোপকথনের মাধ্যমে ভয়কে হাসিতে পরিণত করা ছড়া।"],["সাইক্লোন","মুহম্মদ জাফর ইকবাল","প্রকৃতি ও কিশোর সাহিত্য","🌪️","🌧️","🌴","এটি কবিতা নয়, কিশোর উপন্যাস; ঝড়, সমুদ্র ও প্রকৃতির শক্তিকে কেন্দ্র করে রচিত।"],["আমাদের ছোট নদী","রবীন্দ্রনাথ ঠাকুর","গ্রামবাংলার প্রকৃতি","🏞️","☁️","🌾","নদী, কাশবন, শালিক, আমবন ও বর্ষায় গ্রামের বদলে যাওয়া প্রকৃতির ছবি।"],["সংকল্প","কাজী নজরুল ইসলাম","জ্ঞান ও অভিযাত্রা","🚀","☀️","🌍","জগতকে জানার কৌতূহল, অজানাকে আবিষ্কার এবং সাহসী অভিযাত্রার ভাবনা।"],["প্রিয় স্বাধীনতা","শামসুর রাহমান","স্বাধীনতা ও দেশ","🇧🇩","☀️","🌿","স্বাধীনতার স্মৃতি, দেশ ও মানুষের প্রতি গভীর অনুভূতির কবিতা।"],["ছোটন ঘুমায়","সুফিয়া কামাল","শিশু ও প্রকৃতি","😴","🌙","🌼","শিশুর ঘুম ও কোমল প্রকৃতির আবহে সাজানো শিশুতোষ কবিতা।"],["আতা গাছে তোতা পাখি","যোগীন্দ্রনাথ সরকার","গাছ ও পাখি","🦜","☁️","🌳","আতা গাছ, তোতা পাখি ও গ্রামের পরিচিত প্রকৃতিকে ঘিরে মজার ছড়া।"],["পারিব না","কালিপ্রসন্ন ঘোষ","শিক্ষামূলক","🌱","☀️","🌾","চেষ্টা, অধ্যবসায় ও আত্মবিশ্বাসের মাধ্যমে অসম্ভবকে সম্ভব করার প্রেরণা।"],["ইতল বিতল","সুফিয়া কামাল","বৃষ্টি ও প্রকৃতি","🌧️","☁️","🐸","গাছের পাতা, ব্যাঙের ছাতা ও বৃষ্টির মজার দৃশ্য নিয়ে শিশুতোষ ছড়া।"],["জন্মেছি এই দেশে","সুফিয়া কামাল","দেশ ও প্রকৃতি","🇧🇩","☀️","🌾","বাংলার মাঠ, মাটি, আকাশ-বাতাস ও নদীর সঙ্গে জন্মভূমির গভীর সম্পর্ক।"],["সবার সুখে","জসীমউদ্দীন","মানবতা ও গ্রামবাংলা","🌾","🐦","🌿","অন্যের সুখে আনন্দ ও দুঃখে পাশে থাকার মানবিক শিক্ষার কবিতা।"],["প্রার্থনা","সুফিয়া কামাল","প্রকৃতি ও নৈতিকতা","🤲","🌸","🌊","ফুল, ফল, নদী ও পাখির সৌন্দর্যের জন্য কৃতজ্ঞতা এবং ভালো পথে চলার প্রার্থনা।"],["চিঠি বিলি","রোকনুজ্জামান খান","বর্ষা ও জলজ প্রকৃতি","🐸","🌧️","🐟","বর্ষার দিনে ব্যাঙ, মাছ ও খেয়ানৌকাকে ঘিরে কল্পনার মজার চিত্র।"],["মানুষ জাতি","সত্যেন্দ্রনাথ দত্ত","মানবতা ও প্রকৃতি","🌍","☀️","🌿","এক পৃথিবীর আলো-বাতাসে সব মানুষের সমান মর্যাদা ও মানবিক ঐক্যের বার্তা।"],["হেমন্ত","সুফিয়া কামাল","ঋতু ও প্রকৃতি","🍂","☀️","🌾","শিশির, খেজুরের রস, শিউলি ও হেমন্তের কোমল প্রকৃতির আবহ।"]];const colors=[['#7bd1ff','#67bb66'],['#b9e6a0','#e0bd55'],['#ffd18d','#70bc69'],['#b7e1ff','#74c775'],['#ffb49c','#65aa70'],['#91d7ff','#62a968'],['#d8c2ff','#65b46e'],['#a7dfff','#76be69']];
function render(){document.getElementById('grid').innerHTML=poems.map((p,i)=>'<a class="card" href="#poem-'+i+'" onclick="openReader('+i+');return false;"><div class="cover scene-'+(i+1)+'" style="background:linear-gradient('+colors[i%8][0]+' 0 55%,'+colors[i%8][1]+' 55%)"><div class="cloud">☁️</div><div class="sun">'+p[4]+'</div><div class="big">'+p[3]+'</div><div class="ground">'+p[5]+'</div><div class="birds">🕊️ 🐦</div><div class="river"></div><div class="trees">🌳 🌴 🌳</div><div class="coverText"><h2>'+p[0]+'</h2><div class="author">কবি/লেখক: '+p[1]+'</div><div class="summary">'+p[6]+'</div></div></div><div class="label">'+p[0]+'</div></a>').join('')}
function openReader(i){let p=poems[i];document.getElementById('reader').classList.add('show');document.getElementById('rtitle').textContent=p[0];document.getElementById('rt').textContent=p[0];document.getElementById('ra').textContent='কবি/লেখক: '+p[1];document.getElementById('rs').textContent=p[6];document.getElementById('rbig').textContent=p[3];document.getElementById('rsky').textContent=p[4];document.getElementById('rground').textContent=p[5];document.getElementById('rcap').textContent='🎨 দৃশ্য: '+p[2]+' — '+p[6];let c=colors[i%8];document.getElementById('rcover').style.background='linear-gradient('+c[0]+' 0 55%,'+c[1]+' 55%)'}
function closeReader(){stop();document.getElementById('reader').classList.remove('show')}function speak(){stop();let p=poems.find(x=>x[0]===document.getElementById('rtitle').textContent);let u=new SpeechSynthesisUtterance(p[0]+'. কবি বা লেখক: '+p[1]+'. '+p[6]);u.lang='bn-BD';u.rate=.8;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}render();
</script></body></html>
