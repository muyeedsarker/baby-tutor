<script>
const poems=[{"scene":"scene0","emoji":"🌅","sky":"☁️","ground":"🌾","cat":"ভোর","title":"ভোরের গ্রাম","html":"ভোরের আলো নামে ধীরে,\u003cbr>শিশির হাসে ঘাসের নীড়ে।\u003cbr>মোরগ ডাকে, পাখি গায়,\u003cbr>নতুন সকাল কাছে চায়।","text":"ভোরের আলো নামে ধীরে,\nশিশির হাসে ঘাসের নীড়ে।\nমোরগ ডাকে, পাখি গায়,\nনতুন সকাল কাছে চায়।"},{"scene":"scene1","emoji":"🌾","sky":"☁️","ground":"🌾","cat":"প্রকৃতি","title":"ধানের মাঠ","html":"সবুজ ধানের মাঠের মাঝে,\u003cbr>হাওয়া নাচে আপন সাজে।\u003cbr>সোনার ধান হবে যে একদিন,\u003cbr>হাসবে কৃষক সকাল-সন্ধিন।","text":"সবুজ ধানের মাঠের মাঝে,\nহাওয়া নাচে আপন সাজে।\nসোনার ধান হবে যে একদিন,\nহাসবে কৃষক সকাল-সন্ধিন।"},{"scene":"scene2","emoji":"🛶","sky":"☁️","ground":"🌾","cat":"নদী","title":"নদীর নৌকা","html":"নদীর বুকে ছোট্ট নৌকা,\u003cbr>ঢেউয়ের সাথে দোলে।\u003cbr>মাঝি গায় মিষ্টি সুর,\u003cbr>নদী হাসে তালে।","text":"নদীর বুকে ছোট্ট নৌকা,\nঢেউয়ের সাথে দোলে।\nমাঝি গায় মিষ্টি সুর,\nনদী হাসে তালে।"},{"scene":"scene3","emoji":"🛤️","sky":"☁️","ground":"🌾","cat":"গ্রাম","title":"কাদামাটির পথ","html":"কাদামাটির আঁকাবাঁকা পথ,\u003cbr>চেনে সবাই আপন।\u003cbr>খালি পায়ে ছুটে চলে,\u003cbr>হাসে ছোট্ট মন।","text":"কাদামাটির আঁকাবাঁকা পথ,\nচেনে সবাই আপন।\nখালি পায়ে ছুটে চলে,\nহাসে ছোট্ট মন।"},{"scene":"scene4","emoji":"🥭","sky":"☁️","ground":"🌾","cat":"ফল","title":"আমগাছ","html":"আমগাছ ভরা মুকুলে,\u003cbr>মৌমাছি যায় দুলে।\u003cbr>রোদ উঠিলে পাতার ফাঁকে,\u003cbr>ছায়া নামে কূলে।","text":"আমগাছ ভরা মুকুলে,\nমৌমাছি যায় দুলে।\nরোদ উঠিলে পাতার ফাঁকে,\nছায়া নামে কূলে।"},{"scene":"scene5","emoji":"🌿","sky":"☁️","ground":"🌾","cat":"প্রকৃতি","title":"পুকুরপাড়","html":"পুকুরপাড়ে কচুরিপানা,\u003cbr>জলে ভাসে নীল।\u003cbr>ব্যাঙটি ডাকে ট্যাং ট্যাং করে,\u003cbr>হাসে শাপলা ফুল।","text":"পুকুরপাড়ে কচুরিপানা,\nজলে ভাসে নীল।\nব্যাঙটি ডাকে ট্যাং ট্যাং করে,\nহাসে শাপলা ফুল।"},{"scene":"scene6","emoji":"🌼","sky":"☁️","ground":"🌾","cat":"ফুল","title":"বকুলতলা","html":"বকুলতলায় মিষ্টি গন্ধ,\u003cbr>সকাল যেন গান।\u003cbr>ঝরা ফুলে পথটি ভরে,\u003cbr>খুশি হয় প্রাণ।","text":"বকুলতলায় মিষ্টি গন্ধ,\nসকা let current=0;
const colors=[['#78cfff','#67bb66'],['#a8df9a','#e4c15c'],['#ffd99a','#6ebc66'],['#bde5ff','#7ac77a'],['#ffb7a1','#69ad72'],['#8fd5ff','#58aa68'],['#d8c6ff','#66b66a'],['#9edbff','#74bf67']];
function card(p,i){return '<button class="card" onclick="openReader('+i+')"><div class="picture" style="background:linear-gradient('+colors[i%8][0]+' 0 55%,'+colors[i%8][1]+' 55%)"><div class="big">'+p.emoji+'</div><div class="sky">'+p.sky+'</div><div class="ground">'+p.ground+'</div><div class="words"><b>'+p.title+'</b>'+p.html+'</div></div><div class="name">'+p.title+'</div></button>'}
function render(list=poems){document.getElementById('grid').innerHTML=list.map(p=>card(p,poems.indexOf(p))).join('')}
const cats=['সবগুলো',...new Set(poems.map(p=>p.cat))];
cats.forEach((c,i)=>{let b=document.createElement('button');b.textContent=(i?'🌿 ':'✨ ')+c;b.className=i?'':'active';b.onclick=()=>{document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(c==='সবগুলো'?poems:poems.filter(p=>p.cat===c))};document.getElementById('cats').appendChild(b)});
function openReader(i){current=i;let p=poems[i];document.getElementById('reader').classList.add('show');document.getElementById('rtitle').textContent=p.title;document.getElementById('rt').textContent=p.title;document.getElementById('rx').innerHTML=p.html;document.getElementById('rbig').textContent=p.emoji;document.getElementById('rsky').textContent=p.sky;document.getElementById('rground').textContent=p.ground;let c=colors[i%8];document.getElementById('rpic').style.background='linear-gradient('+c[0]+' 0 55%,'+c[1]+' 55%)'}
function closeReader(){stop();document.getElementById('reader').classList.remove('show')}
function speak(){stop();let u=new SpeechSynthesisUtterance(poems[current].text);u.lang='bn-BD';u.rate=.78;speechSynthesis.speak(u)}
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
render();
</script>
