<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,'Noto Sans Bengali','Noto Sans',sans-serif;background:#fff;color:#222}
body{background:linear-gradient(180deg,#b62d2d 0 120px,#fff 120px 100%)}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:30px}
.header{height:115px;background:#b62d2d;color:#fff;display:flex;align-items:center;gap:18px;padding:16px 22px;box-shadow:0 4px 12px #0002}
.back{font-size:48px;line-height:1;text-decoration:none;color:#fff;font-weight:300}.headtitle{font-size:30px;font-weight:700}.share{margin-left:auto;font-size:34px}
.notice{background:#b62d2d;color:#fff;text-align:center;font-size:18px;font-weight:700;padding:10px 8px 14px}
.player{margin:26px 20px 30px;padding:20px;border:4px dashed #df3037;border-radius:26px;background:#fff}
.audioBox{height:88px;background:#f0f1f3;border-radius:50px;display:flex;align-items:center;gap:18px;padding:0 22px}
.play{border:0;background:none;font-size:30px;cursor:pointer;width:42px}.timer{font-size:18px;min-width:80px}.track{height:7px;background:#666;border-radius:8px;flex:1;position:relative}.track span{display:block;width:0;height:100%;background:#222;border-radius:8px}.knob{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:#222;transform:translate(-50%,-50%)}.speaker{font-size:31px}
.posterWrap{margin:0 20px}.poster{border:4px dashed #df3037;border-radius:28px;padding:17px;background:#fff;box-shadow:0 8px 24px #0001}
.art{height:min(680px,112vw);min-height:520px;border-radius:22px;overflow:hidden;position:relative;color:#fff;background:linear-gradient(#8bd7ff 0 52%,#73c66b 52%);display:flex;align-items:stretch}
.art:before{content:"☁️     ☁️";position:absolute;top:16px;left:20px;font-size:34px;opacity:.8;white-space:pre;z-index:1}
.art:after{content:"🌳   🌾   🌳";position:absolute;bottom:0;left:0;width:100%;font-size:52px;opacity:.9;z-index:1}
.art .bigemoji{position:absolute;left:7%;bottom:14%;font-size:clamp(90px,20vw,155px);filter:drop-shadow(0 7px 4px #0005);z-index:2}
.art .smallsky{position:absolute;right:7%;top:7%;font-size:30px;z-index:2}
.art .smallground{position:absolute;right:6%;bottom:7%;font-size:54px;z-index:2}
.words{position:absolute;z-index:4;right:4%;top:5%;width:54%;max-height:90%;overflow:auto;padding:10px 12px;text-align:center;text-shadow:0 2px 5px #000b}
.words h1{margin:0 0 7px;font-size:clamp(24px,5vw,42px)}.words .author{font-size:15px;margin-bottom:14px;opacity:.95}.words p{margin:0;font-size:clamp(18px,3.5vw,25px);line-height:1.75;font-weight:600}
.controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.ctrl{border:0;border-radius:18px;padding:11px 18px;background:#b62d2d;color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 12px #0002}.ctrl.secondary{background:#fff;color:#b62d2d;border:2px solid #b62d2d}
.next{display:flex;justify-content:flex-end;padding:12px 25px 0}.next button{width:90px;height:90px;border-radius:50%;border:7px solid #59a9ff;background:#829b51;color:#fff;font-size:48px;box-shadow:0 6px 12px #0003;cursor:pointer}
.counter{text-align:center;color:#777;font-weight:800;margin:4px}.cats{display:flex;gap:7px;overflow:auto;padding:8px 20px;scrollbar-width:none}.cats button{white-space:nowrap;border:0;border-radius:20px;padding:8px 13px;background:#f8e8e8;color:#8c2626;font-weight:800}.cats button.active{background:#b62d2d;color:#fff}
@media(max-width:560px){.header{height:95px;padding:12px 17px}.back{font-size:42px}.headtitle{font-size:27px}.share{font-size:30px}.notice{font-size:16px}.player{margin:20px 20px 26px;padding:17px}.audioBox{height:80px;padding:0 15px;gap:10px}.timer{font-size:16px;min-width:65px}.poster{padding:10px}.art{min-height:560px;height:125vw}.art:after{font-size:38px}.art .bigemoji{font-size:95px;bottom:12%;left:4%}.words{right:2%;width:62%;top:4%;padding:5px}.words h1{font-size:27px}.words p{font-size:17px;line-height:1.7}.next{padding-right:16px}.next button{width:76px;height:76px;font-size:40px}}
@media(max-width:390px){.words{width:65%}.words p{font-size:15px}.words h1{font-size:24px}.art{min-height:530px}}
</style>
</head>

<div class="app">
<header class="header"><a class="back" href="index.html">←</a><div class="headtitle" id="headTitle">কবিতা</div><div class="share">⌯</div></header>

<script>

br>ছোট্ট পায়ে হাঁটি যখন,\u003cbr>ঠান্ডা লাগে পাশে।","text":"শিশিরভেজা ঘাসের ডগায়,\nরোদের মুক্তা হাসে।\nছোট্ট পায়ে হাঁটি যখন,\nঠান্ডা লাগে পাশে।"},{"scene":"scene1","emoji":"🐓","sky":"☁️","ground":"🌾","cat":"ভোর","title":"গ্রামের সকাল","html":"মোরগ ডাকে কুকড়ুকু,\u003cbr>জাগে পাড়া ঘর।\u003cbr>সূর্য ওঠে, পাখি গায়,\u003cbr>সুন্দর হয় ভোর।","text":"মোরগ ডাকে কুকড়ুকু,\nজাগে পাড়া ঘর।\nসূর্য ওঠে, পাখি গায়,\nসুন্দর হয় ভোর।"}];
let current=0,utter=null,timerId=null,started=0;
const cats=['সবগুলো',...new Set(poems.map(p=>p.cat))];
const catsEl=document.getElementById('cats');
cats.forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i?'🌿 ':'✨ ')+c;b.onclick=()=>{document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(c==='সবগুলো'){current=0}else{current=poems.findIndex(p=>p.cat===c)}render()};if(i===0)b.classList.add('active');catsEl.appendChild(b)});
function render(){const p=poems[current];document.getElementById('title').textContent=p.title;document.getElementById('headTitle').textContent=p.title;document.getElementById('text').innerHTML=p.html;document.getElementById('counter').textContent=(current+1)+' / '+poems.length+' টি কবিতা';document.getElementById('bigemoji').textContent=p.emoji;document.getElementById('smallsky').textContent=p.sky;document.getElementById('smallground').textContent=p.ground;const art=document.getElementById('art');const colors=[['#ffbd75','#76c96d'],['#78c9ff','#50a8df'],['#aee4ff','#77c96e'],['#c6e8ff','#e3c06b'],['#777cff','#274b55'],['#eaf7ff','#75bd6c'],['#ff9b7b','#5aa866'],['#9fdcff','#69ad69']][current%8];art.style.background='linear-gradient('+colors[0]+' 0 52%,'+colors[1]+' 52%)';stopSpeak();document.getElementById('fill').style.width='0%';document.getElementById('knob').style.left='0';document.getElementById('timer').textContent='0:00'}
function toggleSpeak(){if(utter && speechSynthesis.speaking){speechSynthesis.pause();document.getElementById('play').textContent='▶';return}if(utter && speechSynthesis.paused){speechSynthesis.resume();document.getElementById('play').textContent='Ⅱ';return}startSpeak()}
function startSpeak(){stopSpeak();const p=poems[current];utter=new SpeechSynthesisUtterance(p.text);utter.lang='bn-BD';utter.rate=.78;utter.onstart=()=>{document.getElementById('play').textContent='Ⅱ';started=Date.now();timerId=setInterval(()=>{const sec=Math.floor((Date.now()-started)/1000);document.getElementById('timer').textContent='0:'+String(sec%60).padStart(2,'0');document.getElementById('fill').style.width=Math.min(96,sec*2)+'%';document.getElementById('knob').style.left=Math.min(96,sec*2)+'%'},500)};utter.onend=()=>{document.getElementById('play').textContent='▶';clearInterval(timerId);document.getElementById('fill').style.width='100%';document.getElementById('knob').style.left='100%'};speechSynthesis.speak(utter)}
function stopSpeak(){if('speechSynthesis'in window)speechSynthesis.cancel();clearInterval(timerId);utter=null;document.getElementById('play').textContent='▶'}
function nextPoem(){current=(current+1)%poems.length;render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
