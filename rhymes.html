v><div class="rtrees">🌳 🌴 🌳</div><div class="rtext"><h1 id="rt"></h1><h3 id="ra"></h3><p id="rs"></p><div class="sceneCaption" id="rcap"></div><div class="originalPoem" id="rpoem"></div><div class="copyrightFree">✅ এই পেজের কবিতাগুলো Baby Tutor-এর জন্য নতুন করে লেখা মৌলিক রচনা।</div></div></div></div><div class="note">ℹ️ এখানে প্রতিটি কবিতা Baby Tutor-এর জন্য নতুন করে লেখা হয়েছে। কোনো পাঠ্যবইয়ের মূল কবিতা হুবহু ব্যবহার করা হয়নি।</div><button class="stop" onclick="stop()">⏹ থামি</button></div></div><script>
const poems=[["হাসি","Baby Tutor — মৌলিক রচনা","প্রকৃতি ও প্রাণী","🌿","🐦","🌸","শাপলা, ঘাস, মাছ ও পাখির আনন্দে ভরা হাসির ছড়া।","শাপলা হাসে জলের বুকে,\nপাখি গায় যে ডালে,\nমাছটি লাফায় নীল নদীতে,\nপ্রজাপতি ফুলে দোলে।\nসবুজ ঘাসে শিশুর হাসি,\nরোদ ঝরে চারপাশে,\nপ্রকৃতি আজ আনন্দ নিয়ে\nমিষ্টি হাসি হাসে।"],["জন্মভূমি","Baby Tutor — মৌলিক রচনা","দেশ ও প্রকৃতি","🌳","🌙","🌾","মাটি, নদী, মাঠ ও আকাশের সঙ্গে নিজের দেশের ভালোবাসা।","এই মাটিতে ভোরের আলো,\nএই মাটিতে ফুল,\nনদীর জলে নৌকা ভাসে,\nদোলে কাশের দুল।\nসবুজ মাঠ আর নীল আকাশে\nমনটা যায় যে ভরে,\nআমার দেশকে ভালোবাসি\nহৃদয় জুড়ে ধরে।"],["একুশের কবিতা","Baby Tutor — মৌলিক রচনা","ভাষা ও ফুলের শ্রদ্ধা","🌺","🕊️","🌿","বাংলা ভাষার প্রতি ভালোবাসা ও শ্রদ্ধার শিশুতোষ মৌলিক কবিতা।","ভোরের হাওয়ায় ফুলের গন্ধ,\nবাংলা আমার গান,\nমায়ের ভাষায় কথা বলি,\nভরে ওঠে প্রাণ।\nফুলের মতো পবিত্র হোক\nভাষার প্রতিটি বাণী,\nবাংলা ভাষা ভালোবেসে\nরাখি তারই মানি।"],["লিচু চোর","Baby Tutor — মৌলিক রচনা","লিচুবাগান ও মজার দুষ্টুমি","🍒","☁️","🌳","লিচুবাগানে শিশুর মজার কল্পনা ও প্রকৃতির আনন্দ।","লিচু গাছে লাল লিচু,\nদুলছে ডালে ডালে,\nমৌমাছি যায় গুনগুনিয়ে\nফুলের মধু খেলে।\nবন্ধুরা সব বাগানজুড়ে\nহাসে দৌড়াদৌড়ি,\nলিচু দেখে মিষ্টি মুখে\nফিরে আসে চৌকি।"],["আয় আয় চাঁদ মামা","Baby Tutor — মৌলিক রচনা","চাঁদ ও রাতের প্রকৃতি","🌙","⭐","🌾","চাঁদ, তারা ও রাতের নরম প্রকৃতিকে নিয়ে সম্পূর্ণ নতুন ছড়া।","আয় আয় চাঁদ আকাশপারে,\nরুপালি আলো ঢালো,\nঘুমপাড়ানি রাতের বুকে\nতারার মালা জ্বালো।\nধানের ক্ষেতে শিশির পড়ে,\nজোনাকি দেয় আলো,\nচাঁদ মামার মিষ্টি হাসি\nরাতটাকে করে ভালো।"],["ভয় পেয়ো না","Baby Tutor — মৌলিক রচনা","বৃষ্টি ও প্রাণীর মজা","🐂","☁️","🌿","বৃষ্টিভেজা মাঠে ছোট্ট প্রাণীদের মজার সাহসের গল্প।","মেঘ ডাকিলে ভয় পেয়ো না,\nবৃষ্টি নামে ঝমঝম,\nছোট্ট বাছুর ঘাসের মাঝে\nহাসে টুকটুক টমটম।\nব্যাঙটি বলে, ‘চলো সবাই\nপুকুরপাড়ে যাই’,\nবৃষ্টি শেষে রোদ উঠিলে\nরঙধনু দেখা যায়।"],["সাইক্লোন","Baby Tutor — মৌলিক রচনা","ঝড় ও প্রকৃতির শক্তি","🌪️","🌧️","🌴","ঝড়ের আগে-পরে প্রকৃতি ও নিরাপদ আশ্রয়ের শিক্ষামূলক কবিতা।","আকাশজুড়ে কালো মেঘ,\nদূরে বাজে হাওয়া,\nগাছের পাতা দোলে জোরে,\nনদী ওঠে চাওয়া।\nঝড় এলে ঘরে থাকি,\nবড়দের কথা শুনি,\nঝড় থামিলে সবুজ পাতায়\nনতুন রোদটা গুনি।"],["আমাদের ছোট নদী","Baby Tutor — মৌলিক রচনা","নদী ও গ্রামবাংলা","🏞️","☁️","🌾","ছোট নদী, কাশফুল, নৌকা ও গ্রামের প্রকৃতির মৌলিক ছড়া।","ছোট্ট নদী বয়ে চলে\nসবুজ গ্রামের পাশে,\nকাশফুল দোলে বাতাস পেলে,\nশালিক বসে ঘাসে।\nনৌকা চলে ধীরে ধীরে,\nজলে রোদের হাসি,\nনদীর ধারে বসে আমরা\nগাই যে ভালোবাসি।"],["সংকল্প","Baby Tutor — মৌলিক রচনা","জ্ঞান ও আকাশ","🚀","☀️","🌍","আকাশ, পৃথিবী ও অজানাকে জানার শিশুসুলভ স্বপ্ন।","আকাশ পানে তাকিয়ে বলি,\nজানব কত কথা,\nতারার দেশে কী যে আছে,\nখুঁজব তারই ব্যথা।\nনদী, পাহাড়, বন পেরিয়ে\nশিখব নতুন জ্ঞান,\nচেষ্টা করে স্বপ্ন গড়ব,\nহাসবে আমার প্রাণ।"],["প্রিয় স্বাধীনতা","Baby Tutor — মৌলিক রচনা","দেশ ও সবুজ প্রকৃতি","🇧🇩","☀️","🌿","স্বাধীন দেশের সবুজ মাঠ, নদী ও আকাশকে নিয়ে মৌলিক কবিতা।","সবুজ মাঠে রোদের হাসি,\nনদী বয়ে যায়,\nনীল আকাশে সাদা মেঘের\nভেলা ভেসে যায়।\nএই দেশের মাটি আমার,\nএই দেশের গান,\nস্বাধীনতার আলোয় ভরে\nউজ্জ্বল হোক প্রাণ।"],["ছোটন ঘুমায়","Baby Tutor — মৌলিক রচনা","শিশু ও রাতের প্রকৃতি","😴","🌙","🌼","চাঁদ, ফুল ও নরম রাতের মাঝে শিশুর ঘুমের কোমল ছড়া।","ছোটন ঘুমায় ফুলের পাশে,\nজানালাতে চাঁদ,\nবাতাস এসে দোলায় পর্দা,\nশিউলি ঝরে বাদ।\nঝিঁঝিঁ ডাকে দূর বনে,\nতারার মেলা নামে,\nমিষ্টি স্বপ্ন নিয়ে ছোটন\nঘুমিয়ে পড়ে ঘুমের থামে।"],["আতা গাছে তোতা পাখি","Baby Tutor — মৌলিক রচনা","আতা গাছ ও তোতা পাখি","🦜","☁️","🌳","আতা গাছ, তোতা পাখি ও গ্রামের উঠোনকে নিয়ে নতুন ছড়া।","আতা গাছে তোতা পাখি,\nসবুজ তারই ডানা,\nডালে বসে ডাকে মিঠে,\nশোনে গ্রামের খোকা।\nপাকা আতা মিষ্টি গন্ধে\nভরে উঠোনখানি,\nতোতা বলে, ‘ফলটি রাখো’,\nহাসে সবাই জানি।"],["পারিব না","Baby Tutor — মৌলিক রচনা","চেষ্টা ও প্রকৃতি","🌱","☀️","🌾","বীজ থেকে গাছ হওয়ার মতো ধৈর্য ও চেষ্টার শিক্ষা।","বীজটি বলে, মাটির নিচে\nআমি থাকব না,\nরোদ পেলে আর জল পেলে\nউঠব—হারব না।\nছোট্ট চারা বড় হয়ে\nছায়া দেবে শেষে,\nচেষ্টা করলে পথ যে খোলে,\nশিখি প্রকৃতির দেশে।"],["ইতল বিতল","Baby Tutor — মৌলিক রচনা","বৃষ্টি ও ব্যাঙ","🌧️","☁️","🐸","বৃষ্টি, পাতা, ব্যাঙ ও ছাতার মজার দৃশ্যের নতুন ছড়া।","বৃষ্টি পড়ে টাপুর টুপুর,\nপাতা নাচে দুলে,\nব্যাঙটি পরে পাতার ছাতা,\nলাফায় কাদার কূলে।\nজল জমেছে ছোট্ট গর্তে,\nমাছি উড়ে যায়,\nবৃষ্টি শেষে রোদ উঠিলে\nসবুজ হাসি পায়।"],["জন্মেছি এই দেশে","Baby Tutor — মৌলিক রচনা","বাংলার মাঠ ও নদী","🇧🇩","☀️","🌾","বাংলার মাটি, নদী, মাঠ ও পাখির প্রতি ভালোবাসার মৌলিক কবিতা।","জন্মেছি এই সবুজ দেশে,\nনদী যার সাথি,\nধানের ক্ষেতে বাতাস বাজে,\nপাখি গায় যে গীতি।\nকাদামাটির মিষ্টি গন্ধ,\nশিউলি ভোরের হাসি,\nএই দেশেরই রঙে রঙে\nআমার জীবন ভাসি।"],["সবার সুখে","Baby Tutor — মৌলিক রচনা","মানবতা ও গ্রামবাংলা","🌾","🐦","🌿","অন্যের সুখে আনন্দ ও প্রকৃতির সঙ্গে মিলেমিশে থাকার শিক্ষা।","সবার মুখে হাসি ফুটুক,\nফুল ফুটুক বনে,\nপাখি গাইুক ভোরের গানটি\nসবুজ পাতার কোণে।\nযারই দুঃখ, পাশে দাঁড়াই,\nভালো কথা বলি,\nসবার সুখে সুখী হয়ে\nহাসির মালা গলি।"],["প্রার্থনা","Baby Tutor — মৌলিক রচনা","ফুল, নদী ও নৈতিকতা","🤲","🌸","🌊","প্রকৃতির সৌন্দর্য দেখে কৃতজ্ঞতা ও ভালো হওয়ার প্রার্থনা।","ফুলের গন্ধ দাও যে মনে,\nনদীর মতো চলি,\nপাখির মতো মুক্ত হয়ে\nমিষ্টি কথা বলি।\nগাছের ছায়া সবার হোক,\nজল হোক নির্মল,\nভালো কাজের আলোয় ভরে\nআমার সকাল-বিকাল।"],["চিঠি বিলি","Baby Tutor — মৌলিক রচনা","বর্ষা, ব্যাঙ ও নৌকা","🐸","🌧️","🐟","বর্ষার দিনে ব্যাঙ, মাছ ও নৌকার কল্পিত চিঠি বিলির মজার ছড়া।","ব্যাঙটি নাকি চিঠি লিখে\nপুকুরপাড়ের কাছে,\n‘মাছের ভাই, আজ বৃষ্টি নামে,\nনৌকা কোথায় আছে?’\nনৌকা ভাসে টলমলিয়ে,\nমাছটি হাসে জলে,\nবর্ষা যেন চিঠি বিলায়\nসবুজ গ্রামের কোলে।"],["মানুষ জাতি","Baby Tutor — মৌলিক রচনা","মানবতা ও পৃথিবী","🌍","☀️","🌿","এক পৃথিবীতে সবার সমান মর্যাদা ও মিলেমিশে থাকার বার্তা।","একই আকাশ সবার মাথায়,\nএকই রোদের আলো,\nএকই নদীর জলে ভাসে\nস্বপ্ন কত ভালো।\nরঙ আলাদা, ভাষা আলাদা,\nতবু মানুষ এক,\nভালোবাসার হাত বাড়ালে\nদূর হয় যত ফাঁক।"],["হেমন্ত","Baby Tutor — মৌলিক রচনা","হেমন্তের প্রকৃতি","🍂","☀️","🌾","শিশির, ধানক্ষেত, খেজুরের রস ও হেমন্তের সকালের ছবি।","হেমন্ত ভোরে শিশির নামে\nধানের সবুজ পাতায়,\nখেজুর গাছে মিষ্টি রসের\nঘ্রাণ ভেসে যায় হাওয়ায়।\nশিউলি ঝরে উঠোনজুড়ে,\nরোদটি নরম হাসে,\nহেমন্ত এসে সোনার রঙে\nগ্রামকে সাজায় পাশে।"]];const colors=[['#7bd1ff','#67bb66'],['#b9e6a0','#e0bd55'],['#ffd18d','#70bc69'],['#b7e1ff','#74c775'],['#ffb49c','#65aa70'],['#91d7ff','#62a968'],['#d8c2ff','#65b46e'],['#a7dfff','#76be69']];
function render(){document.getElementById('grid').innerHTML=poems.map((p,i)=>'<a class="card" href="#poem-'+i+'" onclick="openReader('+i+');return false;"><div class="cover scene-'+(i+1)+'" style="background:linear-gradient('+colors[i%8][0]+' 0 55%,'+colors[i%8][1]+' 55%)"><div class="cloud">☁️</div><div class="sun">'+p[4]+'</div><div class="big">'+p[3]+'</div><div class="ground">'+p[5]+'</div><div class="birds">🕊️ 🐦</div><div class="river"></div><div class="trees">🌳 🌴 🌳</div><div class="coverText"><h2>'+p[0]+'</h2><div class="author">কবি/লেখক: '+p[1]+'</div><div class="summary">'+p[6]+'</div></div></div><div class="label">'+p[0]+'</div></a>').join('')}
function openReader(i){let p=poems[i];document.getElementById('reader').classList.add('show');document.getElementById('rtitle').textContent=p[0];document.getElementById('rt').textContent=p[0];document.getElementById('ra').textContent='কবি/লেখক: '+p[1];document.getElementById('rs').textContent=p[6];document.getElementById('rbig').textContent=p[3];document.getElementById('rsky').textContent=p[4];document.getElementById('rground').textContent=p[5];document.getElementById('rcap').textContent='🎨 দৃশ্য: '+p[2]+' — '+p[6];document.getElementById('rpoem').textContent=p[7];let c=colors[i%8];document.getElementById('rcover').style.background='linear-gradient('+c[0]+' 0 55%,'+c[1]+' 55%)'}
function closeReader(){stop();document.getElementById('reader').classList.remove('show')}function speak(){stop();let p=poems.find(x=>x[0]===document.getElementById('rtitle').textContent);let u=new SpeechSynthesisUtterance(p[0]+'. '+p[7]);u.lang='bn-BD';u.rate=.8;speechSynthesis.speak(u)}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}render();
</script></body></html>
