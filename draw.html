<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আঁকা ও রং — Baby Tutor</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,'Noto Sans Bengali','Noto Sans',sans-serif;background:linear-gradient(180deg,#eef9ff,#fff8ed);color:#263247}.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;background:#ffffffea;border-radius:22px;padding:11px 15px;box-shadow:0 8px 25px #0001;position:sticky;top:8px;z-index:20}.brand{font-weight:900;color:#b52e31;font-size:20px}.back{background:#b52e31;color:#fff;padding:9px 14px;border-radius:15px;font-weight:800}.hero{margin:15px 0;padding:28px 18px;border-radius:28px;text-align:center;color:#fff;background:linear-gradient(135deg,#b52e31,#e36a50,#f5b35b);box-shadow:0 14px 30px #0002}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px 0}.hero p{margin:0;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 9px 22px #0001;text-align:center;border:2px solid #fff}.big{font-size:45px}.card h3{margin:8px 0;color:#9a6500}.lesson{margin-top:18px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 9px 22px #0001}.letters{font-size:clamp(28px,6vw,48px);line-height:2.2;text-align:center;font-weight:800;color:#6a4be7}.btn{border:0;border-radius:15px;padding:11px 16px;background:#b52e31;color:#fff;font-weight:800;cursor:pointer;margin:4px}.soft{background:#fff2d9;color:#754d00}.footer{text-align:center;margin:28px 0;padding:22px;background:#fff;border-radius:22px;color:#718096}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{padding:13px}.letters{font-size:27px}}
</style><style>canvas{width:100%;height:420px;border:3px dashed #e0b45b;border-radius:22px;background:#fff;touch-action:none}.colors{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dot{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 7px #0003;cursor:pointer}</style></head><body><main class="wrap"><header class="top"><div class="brand">🧸 Baby Tutor</div><a class="back" href="index.html">← হোম</a></header><section class="hero"><div>🎨 🖍️ 🌈</div><h1>আঁকা ও রং</h1><p>নিজের হাতে ছবি আঁকি</p></section><section class="lesson"><div class="colors" id="colors"></div><canvas id="canvas"></canvas><div style="text-align:center;margin-top:10px"><button class="btn" onclick="clearCanvas()">🧹 মুছি</button><button class="btn soft" onclick="thick()">🖌️ মোটা দাগ</button></div></section><footer class="footer">🎨 আঁকো, রং করো, নিজের ছবি বানাও!</footer></main><script>const c=document.getElementById('canvas'),ctx=c.getContext('2d');let drawing=false,color='#b52e31',size=6;function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round'}resize();window.onresize=resize;function pos(e){let r=c.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}}function start(e){drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}function move(e){if(!drawing)return;let p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}function end(){drawing=false}c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);c.addEventListener('mouseup',end);c.addEventListener('mouseleave',end);c.addEventListener('touchstart',start);c.addEventListener('touchmove',move);c.addEventListener('touchend',end);['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22','#111111'].forEach(x=>{let d=document.createElement('button');d.className='dot';d.style.background=x;d.onclick=()=>color=x;document.getElementById('colors').appendChild(d)});function clearCanvas(){ctx.clearRect(0,0,c.width,c.height)}function thick(){size=size===6?14:6}</script></body></html>
