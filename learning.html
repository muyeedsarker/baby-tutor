function say(t){if(!('speechSynthesis'in window)){alert('এই ব্রাউজারে ভয়েস সুবিধা নেই।');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.82;speechSynthesis.speak(u)}
function openPanel(title,html){document.getElementById('panelTitle').textContent=title;document.getElementById('panelBody').innerHTML=html;document.getElementById('lessonPanel').classList.add('show');document.getElementById('lessonPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function closePanel(){document.getElementById('lessonPanel').classList.remove('show');speechSynthesis.cancel()}
function itemButtons(arr,mode){return '<div class="items">'+arr.map((x,i)=>{let label=Array.isArray(x)?x[1]:x;let sub=Array.isArray(x)?x[0]:'';let val=Array.isArray(x)?x[2]:x;return '<button class="item" onclick="say('+JSON.stringify(String(val))+')">'+label+'<small>'+sub+'</small></button>'}).join('')+'</div>'}
function math(type){let a=Math.floor(Math.random()*9)+1,b=Math.floor(Math.random()*9)+1,op='+',ans=a+b;if(type==='sub'){if(b>a)[a,b]=[b,a];op='−';ans=a-b}if(type==='mul'){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;op='×';ans=a*b}if(type==='div'){b=Math.floor(Math.random()*9)+1;ans=Math.floor(Math.random()*9)+1;a=b*ans;op='÷'}if(type==='mix'){const r=['add','sub','mul','div'];return math(r[Math.floor(Math.random()*4)])}let opts=new Set([ans]);while(opts.size<3){let d=Math.floor(Math.random()*7)-3;if(d)opts.add(Math.max(0,ans+d))}openPanel('🎯 গণিত অনুশীলন','<div class="math-box"><div class="math-q">'+a+' '+op+' '+b+' = ?</div><div class="answers">'+[...opts].sort(()=>Math.random()-.5).map(v=>'<button onclick="checkMath('+v+','+ans+')">'+v+'</button>').join('')+'</div><div id="mathResult" class="result"></div><div class="action-row"><button class="action" onclick="math('+JSON.stringify(type)+')">➡️ নতুন প্রশ্ন</button></div></div>')}
function checkMath(v,a){const el=document.getElementById('mathResult');if(v===a){el.textContent='🌟 সঠিক! দারুণ কাজ!';el.style.color='#0b9e73'}else{el.textContent='আবার চেষ্টা করি 😊';el.style.color='#d04b4b'}say(v===a?'সঠিক উত্তর! দারুণ কাজ!':'আবার চেষ্টা করি')}

function richIntro(title){
const d=details[title]||[title,'এই বিষয়ের মূল ধারণা, উদাহরণ ও অনুশীলন এক জায়গায় দেখানো হবে।','ট্যাপ করে তথ্য শুনুন এবং অনুশীলন করুন।'];
return '<div class="digital-info"><div class="info-card"><b>📘 কী শিখবে?</b>'+d[1]+'</div><div class="info-card"><b>🎯 লক্ষ্য</b>চেনা → বোঝা → বলা → অনুশীলন</div><div class="info-card"><b>🔊 শুনে শেখা</b>নিচের বাটনে ট্যাপ করলে শব্দ উচ্চারণ করে শোনানো হবে।</div></div><div class="example"><b>💡 উদাহরণ:</b> '+d[2]+'</div>';
}

function makePanel(x){
const title=x[1],type=x[3],data=x[4];
if(type==='letters'||type==='pronounce')openPanel(title,richIntro(title)+'<p class="panelIntro">একটি অক্ষরে ট্যাপ করো। অক্ষরটি বড় করে দেখার মতো ডিজিটাল কার্ডে থাকবে এবং উচ্চারণ শোনা যাবে।</p>'+itemButtons(data)+'<div class="action-row"><a class="action" href="draw.html">✍️ লিখে অনুশীলন</a><a class="action alt" href="quiz.html">🎯 কুইজ</a></div>');
else if(type==='numbers')openPanel(title,richIntro(title)+'<p class="panelIntro">প্রতিটি সংখ্যা একটি ডিজিটাল শেখার কার্ড। ট্যাপ করলে উচ্চারণ শুনবে।</p>'+itemButtons(data)+'<div class="action-row"><button class="action" onclick="say("এক থেকে একশ পর্যন্ত সংখ্যা অনুশীলন করি")">🔊 পুরো পরিসর শুনি</button></div>');
else if(type==='words'||type==='list')openPanel(title,richIntro(title)+'<p class="panelIntro">প্রতিটি শব্দ আলাদা কার্ডে আছে। কার্ডে ট্যাপ করে শব্দটি শুনো।</p>'+itemButtons(data));
else if(type==='sounds')openPanel(title,richIntro(title)+'<p class="panelIntro">নাম ও ডাক একসাথে দেখে/শুনে মিলিয়ে শেখো।</p>'+itemButtons(data));
else if(type==='match')openPanel(title,richIntro(title)+'<p class="panelIntro">অক্ষর দেখে উচ্চারণ শুনে মনে রাখো, তারপর কুইজে গিয়ে চিনে উত্তর দাও।</p>'+itemButtons(data.map(v=>[v,'অক্ষর',v]))+'<div class="action-row"><a class="action" href="quiz.html">🎯 অক্ষর কুইজ খেলি</a></div>');
else if(type==='draw')openPanel(title,richIntro(title)+'<p class="panelIntro">ডিজিটাল ক্যানভাসে আঙুল বা মাউস দিয়ে লিখে/এঁকে অনুশীলন করো।</p><div class="action-row"><a class="action" href="draw.html">🎨 ডিজিটাল আঁকার পাতা খুলুন</a></div>');
else if(type==='tables')openPanel(title,richIntro(title)+'<p class="panelIntro">প্রথমে কয়েকটি উদাহরণ দেখো। এরপর “আরও নামতা” চাপলে ১–১০০ পর্যন্ত নির্বাচিত নামতা দেখা যাবে।</p>'+itemButtons(Array.from({length:20},(_,i)=>[i+1+' × 2 = '+(i+1)*2,'উদাহরণ',String((i+1)*2)]))+'<div class="action-row"><button class="action" onclick="openTables()">📚 আরও নামতা</button></div>');
else if(type==='math')math(data);
else if(type==='link')openPanel(title,richIntro(title)+'<div class="action-row"><a class="action" href="'+data+'">🚀 বিস্তারিত পেজ খুলুন</a></div>');
else if(type==='progress')openPanel(title,richIntro(title)+'<div class="action-row"><a class="action" href="kids-learning.html">🤖 Smart Learning খুলুন</a></div>');
else openPanel(title,richIntro(title)+'<div class="items"><button class="item" onclick="say(\'বাংলাদেশের রাজধানী ঢাকা।\')">🇧🇩 বাংলাদেশ<small>রাজধানী: ঢাকা</small></button><button class="item" onclick="say(\'ভালো আচরণ করি, সত্য কথা বলি, অন্যকে সাহায্য করি।\')">💚 ভালো আচরণ<small>সততা ও সহযোগিতা</small></button><button class="item" onclick="say(\'এই বিষয়টি সহজ ভাষায় ধাপে ধাপে শেখা যায়।\')">📚 শিখি<small>ডিজিটাল কার্ড</small></button></div>');
}
function openTables(){const arr=[];for(let n=1;n<=100;n++)for(let m=1;m<=10;m++)arr.push(n+' × '+m+' = '+n*m);openPanel('📚 ১–১০০ নামতা','<p class="panelIntro">একটি উদাহরণে ট্যাপ করলে উচ্চারণ শোনা যাবে।</p>'+itemButtons(arr.slice(0,100)))}
function render(){document.getElementById('hub').innerHTML=groups.map(g=>'<section class="section"><h2>'+g[0]+'</h2><div class="cards">'+g[1].map((x,i)=>'<button class="topic '+x[2]+'" onclick="makePanel(groups['+groups.indexOf(g)+'][1]['+i+'])"><span class="emoji">'+x[0]+'</span><strong>'+x[1]+'</strong><small>ট্যাপ করে খুলুন →</small></button>').join('')+'</div></section>').join('')}
function openAllSections(){const first=document.querySelector('.section');if(first)first.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.topic').forEach((b,i)=>{b.style.outline='3px solid #ffffff66';setTimeout(()=>b.style.outline='',900+(i%8)*120)})}
render();
</script>
