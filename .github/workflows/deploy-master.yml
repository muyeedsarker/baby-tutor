name: Deploy Baby Tutor Master

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-master:
    if: github.event.head_commit.message != 'Deploy Baby Tutor Master files'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Master ZIP
        run: |
          rm -rf /tmp/baby-tutor-master
          mkdir -p /tmp/baby-tutor-master
          unzip -o baby-tutor-v50-icon.zip -d /tmp/baby-tutor-master

      - name: Remove duplicate top header controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/baby-tutor-master/index.html")
          s = p.read_text(encoding="utf-8")
          import re
          css = '<style id="bt-hide-duplicate-header-controls">html,body{max-width:100%;overflow-x:hidden!important}header.hero,.hero{max-width:100%;overflow-x:hidden!important}header.hero img,.hero img{max-width:100%!important;height:auto;object-fit:contain;display:block}header.hero>.hd-b,header.hero>.hd-m,header.hero>.hd-s,header.hero>#hs,header.hero>.hd-search,header.hero>.hd-sound{display:none!important;visibility:hidden!important;pointer-events:none!important}#hb-all .hb-chips{display:none!important}#bt2 .tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}#bt2 .tb button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 16px;border:1px solid rgba(255,255,255,.85)!important;border-radius:16px!important;background:linear-gradient(145deg,#fff 0%,#f3f7ff 48%,#e6edff 100%)!important;color:#24345b!important;font-weight:800!important;letter-spacing:.15px;box-shadow:0 5px 0 rgba(64,83,145,.22),0 9px 18px rgba(28,47,105,.16),inset 0 1px 0 #fff!important;text-shadow:0 1px 0 #fff;transition:transform .15s ease,box-shadow .15s ease;overflow:hidden}#bt2 .tb button:before{content:"";position:absolute;inset:0 0 52%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}#bt2 .tb button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(64,83,145,.22),0 4px 9px rgba(28,47,105,.14),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="menu"]{background:linear-gradient(145deg,#dff7ff,#a9e7ff 55%,#7dd3fc)!important;color:#06456a!important;box-shadow:0 5px 0 #56a9ce,0 9px 18px rgba(14,116,144,.2),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="snd"]{background:linear-gradient(145deg,#fff2c9,#ffd875 55%,#ffbd45)!important;color:#74420a!important;box-shadow:0 5px 0 #d99a2c,0 9px 18px rgba(180,112,16,.2),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="search"]{background:linear-gradient(145deg,#e9e2ff,#c9b9ff 55%,#a997ff)!important;color:#392078!important;box-shadow:0 5px 0 #8a75d7,0 9px 18px rgba(91,66,171,.2),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="fav"],#bt2 .tb button[data-a="favorite"],#bt2 .tb button[data-a="favs"]{background:linear-gradient(145deg,#ffe4ee,#ffb8d1 55%,#ff8fb8)!important;color:#7b1740!important;box-shadow:0 5px 0 #d86b96,0 9px 18px rgba(190,24,93,.18),inset 0 1px 0 #fff!important}@media(max-width:480px){#bt2 .tb{gap:8px}#bt2 .tb button{min-height:42px;padding:9px 12px;border-radius:14px!important;font-size:13px!important}}</style>'
          if "</head>" not in s:
              raise SystemExit("Could not safely locate </head>; stopping without changing Master.")
          if 'id="bt-hide-duplicate-header-controls"' in s:
              s = re.sub(r'<style id="bt-hide-duplicate-header-controls">.*?</style>', css, s, count=1, flags=re.S)
          else:
              s = s.replace("</head>", css + "</head>", 1)
          p.write_text(s, encoding="utf-8")
          print("All hero-overlay controls hidden; lower-row toolbar preserved.")
          PY
          cd /tmp/baby-tutor-master
          zip -q -FS "$GITHUB_WORKSPACE/baby-tutor-v50-icon.zip" README.txt apple-touch-icon.png favicon.png icon-192.png icon-512.png icon-maskable-512.png index.html manifest.webmanifest

      - name: Copy Master files to Pages root
        run: |
          cp /tmp/baby-tutor-master/index.html .
          cp /tmp/baby-tutor-master/manifest.webmanifest .
          cp /tmp/baby-tutor-master/icon-192.png .
          cp /tmp/baby-tutor-master/icon-512.png .
          cp /tmp/baby-tutor-master/icon-maskable-512.png .
          cp /tmp/baby-tutor-master/apple-touch-icon.png .
          cp /tmp/baby-tutor-master/favicon.png .
          cp /tmp/baby-tutor-master/README.txt .

      - name: Commit Master files
        run: |
          git config user.name "Baby Tutor Master Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add baby-tutor-v50-icon.zip index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon.png README.txt
          if git diff --cached --quiet; then
            echo "No Master file changes."
            exit 0
          fi
          git commit -m "Deploy Baby Tutor Master files"
          git push
