name: Deploy Baby Tutor Master

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-master:
    if: github.event.head_commit.message != 'Deploy Baby Tutor Master files'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Master ZIP
        run: |
          rm -rf /tmp/baby-tutor-master
          mkdir -p /tmp/baby-tutor-master
          unzip -o baby-tutor-v50-icon.zip -d /tmp/baby-tutor-master

      - name: Remove duplicate top header controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/baby-tutor-master/index.html")
          s = p.read_text(encoding="utf-8")
          import re
          css = '<style id="bt-hide-duplicate-header-controls">html,body{max-width:100%;overflow-x:hidden!important}header.hero,.hero{max-width:100%;overflow-x:hidden!important}header.hero img,.hero img{max-width:100%!important;height:auto;object-fit:contain;display:block}header.hero>.hd-b,header.hero>.hd-m,header.hero>.hd-s,header.hero>#hs,header.hero>.hd-search,header.hero>.hd-sound{display:none!important;visibility:hidden!important;pointer-events:none!important}#hb-all .hb-chips{display:none!important}button,.btn,[role="button"],a.button,input[type="button"],input[type="submit"]{appearance:none;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 15px;border:1px solid rgba(255,255,255,.45)!important;border-radius:15px!important;background:linear-gradient(145deg,#dff7ff 0%,#a9e7ff 52%,#75cfff 100%)!important;color:#073b5a!important;font-weight:800!important;box-shadow:0 5px 0 #4ba7cc,0 8px 16px rgba(14,116,144,.18),inset 0 1px 0 rgba(255,255,255,.8)!important;text-shadow:none!important;transition:transform .15s ease,box-shadow .15s ease;overflow:hidden}button:active,.btn:active,[role="button"]:active,a.button:active,input[type="button"]:active,input[type="submit"]:active{transform:translateY(3px);box-shadow:0 2px 0 #4ba7cc,0 4px 8px rgba(14,116,144,.15)!important}button:before,.btn:before,[role="button"]:before,a.button:before{content:"";position:absolute;inset:0 0 55%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);pointer-events:none}#hb-all .hb-group,#hb-all .hb-section{background:transparent!important;box-shadow:none!important}#hb-all .hb-gh{position:relative!important;overflow:hidden!important;border:4px solid #fff!important;border-radius:28px!important;background:linear-gradient(145deg,#ffe0e8,#ff9eb5 58%,#f76b91)!important;box-shadow:0 7px 0 #b94d6e,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 rgba(255,255,255,.85)!important;color:#fff!important}#hb-all .hb-gh:nth-child(12n+2){background:linear-gradient(145deg,#fff2bd,#ffd45e 58%,#ffb52e)!important;box-shadow:0 7px 0 #bd7e1c,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+3){background:linear-gradient(145deg,#d8ffe8,#80e7b0 58%,#38c98a)!important;box-shadow:0 7px 0 #218456,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+4){background:linear-gradient(145deg,#e6e0ff,#b7a5ff 58%,#9178f5)!important;box-shadow:0 7px 0 #6752bd,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+5){background:linear-gradient(145deg,#d9f7ff,#83ddf7 58%,#39bfe8)!important;box-shadow:0 7px 0 #2086a5,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+6){background:linear-gradient(145deg,#ffe8d2,#ffbd83 58%,#ff9858)!important;box-shadow:0 7px 0 #c9652f,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+7){background:linear-gradient(145deg,#f9dfff,#e7a8f4 58%,#d879e8)!important;box-shadow:0 7px 0 #a341b5,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+8){background:linear-gradient(145deg,#e5f6c8,#b8e76e 58%,#8bcf43)!important;box-shadow:0 7px 0 #659927,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+9){background:linear-gradient(145deg,#ffe2c9,#ffad91 58%,#f47e73)!important;box-shadow:0 7px 0 #b94e46,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+10){background:linear-gradient(145deg,#d9e8ff,#9ec5ff 58%,#6b9ff5)!important;box-shadow:0 7px 0 #3c6eb5,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n+11){background:linear-gradient(145deg,#d7fff8,#7fe4d6 58%,#42c5b4)!important;box-shadow:0 7px 0 #21887f,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:nth-child(12n){background:linear-gradient(145deg,#f1e1d0,#d9b994 58%,#bd8e65)!important;box-shadow:0 7px 0 #896343,0 13px 22px rgba(50,40,70,.22),inset 0 2px 0 #fff9!important}#hb-all .hb-gh:after{content:"";position:absolute;right:-12px;bottom:-24px;width:95px;height:95px;border-radius:50%;background:rgba(255,255,255,.16);pointer-events:none}#hb-all .hb-gh .emoji,#hb-all .hb-gh .icon,#hb-all .hb-gh .ico,#hb-all .hb-gh .em,#hb-all .hb-gh .hb-icon{background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important}#bt2 .tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}#bt2 .tb button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 16px;border:1px solid rgba(255,255,255,.85)!important;border-radius:16px!important;background:linear-gradient(145deg,#fff 0%,#f3f7ff 48%,#e6edff 100%)!important;color:#24345b!important;font-weight:800!important;letter-spacing:.15px;box-shadow:0 5px 0 rgba(64,83,145,.22),0 9px 18px rgba(28,47,105,.16),inset 0 1px 0 #fff!important;text-shadow:0 1px 0 #fff;transition:transform .15s ease,box-shadow .15s ease;overflow:hidden}#bt2 .tb button:before{content:"";position:absolute;inset:0 0 52%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}#bt2 .tb button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(64,83,145,.22),0 4px 9px rgba(28,47,105,.14),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="menu"]{background:linear-gradient(145deg,#dff7ff,#a9e7ff 55%,#7dd3fc)!important;color:#06456a!important;box-shadow:0 5px 0 #56a9ce,0 9px 18px rgba(14,116,144,.2),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="snd"]{background:linear-gradient(145deg,#fff2c9,#ffd875 55%,#ffbd45)!important;color:#74420a!important;box-shadow:0 5px 0 #d99a2c,0 9px 18px rgba(180,112,16,.2),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="search"]{background:linear-gradient(145deg,#e9e2ff,#c9b9ff 55%,#a997ff)!important;color:#392078!important;box-shadow:0 5px 0 #8a75d7,0 9px 18px rgba(91,66,171,.2),inset 0 1px 0 #fff!important}#bt2 .tb button[data-a="fav"],#bt2 .tb button[data-a="favorite"],#bt2 .tb button[data-a="favs"]{background:linear-gradient(145deg,#ffe4ee,#ffb8d1 55%,#ff8fb8)!important;color:#7b1740!important;box-shadow:0 5px 0 #d86b96,0 9px 18px rgba(190,24,93,.18),inset 0 1px 0 #fff!important}@media(max-width:480px){#bt2 .tb{gap:8px}#bt2 .tb button{min-height:42px;padding:9px 12px;border-radius:14px!important;font-size:13px!important}}/* Per-button premium palette: deliberately override the earlier uniform blue rule */#hb-all button:nth-of-type(12n+1),#hb-all .btn:nth-of-type(12n+1),#hb-all [role="button"]:nth-of-type(12n+1){background:linear-gradient(145deg,#ffe0e8,#ff9eb5 58%,#f76b91)!important;color:#68152d!important;box-shadow:0 5px 0 #c94f73,0 9px 16px #d94d772b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+2),#hb-all .btn:nth-of-type(12n+2),#hb-all [role="button"]:nth-of-type(12n+2){background:linear-gradient(145deg,#fff2bd,#ffd45e 58%,#ffb52e)!important;color:#67400a!important;box-shadow:0 5px 0 #d18a20,0 9px 16px #b779182b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+3),#hb-all .btn:nth-of-type(12n+3),#hb-all [role="button"]:nth-of-type(12n+3){background:linear-gradient(145deg,#d8ffe8,#80e7b0 58%,#38c98a)!important;color:#064b32!important;box-shadow:0 5px 0 #269a66,0 9px 16px #1684542b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+4),#hb-all .btn:nth-of-type(12n+4),#hb-all [role="button"]:nth-of-type(12n+4){background:linear-gradient(145deg,#e6e0ff,#b7a5ff 58%,#9178f5)!important;color:#302064!important;box-shadow:0 5px 0 #7560d0,0 9px 16px #6650b82b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+5),#hb-all .btn:nth-of-type(12n+5),#hb-all [role="button"]:nth-of-type(12n+5){background:linear-gradient(145deg,#d9f7ff,#83ddf7 58%,#39bfe8)!important;color:#06485d!important;box-shadow:0 5px 0 #2598bc,0 9px 16px #1686a42b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+6),#hb-all .btn:nth-of-type(12n+6),#hb-all [role="button"]:nth-of-type(12n+6){background:linear-gradient(145deg,#ffe8d2,#ffbd83 58%,#ff9858)!important;color:#6a2d0d!important;box-shadow:0 5px 0 #d77739,0 9px 16px #bd63252b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+7),#hb-all .btn:nth-of-type(12n+7),#hb-all [role="button"]:nth-of-type(12n+7){background:linear-gradient(145deg,#f9dfff,#e7a8f4 58%,#d879e8)!important;color:#5b1b68!important;box-shadow:0 5px 0 #b04fc1,0 9px 16px #a044b52b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+8),#hb-all .btn:nth-of-type(12n+8),#hb-all [role="button"]:nth-of-type(12n+8){background:linear-gradient(145deg,#e5f6c8,#b8e76e 58%,#8bcf43)!important;color:#294b0b!important;box-shadow:0 5px 0 #70a82c,0 9px 16px #639b202b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+9),#hb-all .btn:nth-of-type(12n+9),#hb-all [role="button"]:nth-of-type(12n+9){background:linear-gradient(145deg,#ffe2c9,#ffad91 58%,#f47e73)!important;color:#67251f!important;box-shadow:0 5px 0 #c75a51,0 9px 16px #b94d452b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+10),#hb-all .btn:nth-of-type(12n+10),#hb-all [role="button"]:nth-of-type(12n+10){background:linear-gradient(145deg,#d9e8ff,#9ec5ff 58%,#6b9ff5)!important;color:#163b70!important;box-shadow:0 5px 0 #477bc8,0 9px 16px #3a6fba2b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n+11),#hb-all .btn:nth-of-type(12n+11),#hb-all [role="button"]:nth-of-type(12n+11){background:linear-gradient(145deg,#d7fff8,#7fe4d6 58%,#42c5b4)!important;color:#064d46!important;box-shadow:0 5px 0 #269d91,0 9px 16px #1b8d812b,inset 0 1px 0 #fff8!important}#hb-all button:nth-of-type(12n),#hb-all .btn:nth-of-type(12n),#hb-all [role="button"]:nth-of-type(12n){background:linear-gradient(145deg,#f1e1d0,#d9b994 58%,#bd8e65)!important;color:#4d321d!important;box-shadow:0 5px 0 #98704c,0 9px 16px #805a3a2b,inset 0 1px 0 #fff8!important}/* Remove decorative white circular disks behind button icons, while preserving button surfaces */#hb-all button .emoji,#hb-all button .icon,#hb-all button .ico,#hb-all button .em,#hb-all button .hb-icon,#hb-all .hb-gh .emoji,#hb-all .hb-gh .icon,#hb-all .hb-gh .ico,#hb-all .hb-gh .em,#hb-all .hb-gh .hb-icon{background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important}#hb-all .hb-gh,#hb-all .hb-gh>div,#hb-all .hb-gh>section,#hb-all .hb-gh .card,#hb-all .hb-gh .item{background:transparent!important;box-shadow:none!important}</style>'
          if "</head>" not in s:
              raise SystemExit("Could not safely locate </head>; stopping without changing Master.")
          if 'id="bt-hide-duplicate-header-controls"' in s:
              s = re.sub(r'<style id="bt-hide-duplicate-header-controls">.*?</style>', css, s, count=1, flags=re.S)
          else:
              s = s.replace("</head>", css + "</head>", 1)
          p.write_text(s, encoding="utf-8")
          print("All hero-overlay controls hidden; lower-row toolbar preserved.")
          PY
          cd /tmp/baby-tutor-master
          zip -q -FS "$GITHUB_WORKSPACE/baby-tutor-v50-icon.zip" README.txt apple-touch-icon.png favicon.png icon-192.png icon-512.png icon-maskable-512.png index.html manifest.webmanifest

      - name: Copy Master files to Pages root
        run: |
          cp /tmp/baby-tutor-master/index.html .
          cp /tmp/baby-tutor-master/manifest.webmanifest .
          cp /tmp/baby-tutor-master/icon-192.png .
          cp /tmp/baby-tutor-master/icon-512.png .
          cp /tmp/baby-tutor-master/icon-maskable-512.png .
          cp /tmp/baby-tutor-master/apple-touch-icon.png .
          cp /tmp/baby-tutor-master/favicon.png .
          cp /tmp/baby-tutor-master/README.txt .

      - name: Commit Master files
        run: |
          git config user.name "Baby Tutor Master Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add baby-tutor-v50-icon.zip index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon.png README.txt
          if git diff --cached --quiet; then
            echo "No Master file changes."
            exit 0
          fi
          git commit -m "Deploy Baby Tutor Master files"
          git push
