name: Apply Baby Tutor Premium Button Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: !startsWith(github.event.head_commit.message, 'Apply Baby Tutor Premium Button Theme')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject premium button theme into Master index
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "/* BABY-TUTOR-PREMIUM-BUTTONS-V2 */"
          if marker in s:
              print("Theme already present")
              raise SystemExit(0)
          css = r"""
          <style id="bt-premium-buttons-v2">
          /* BABY-TUTOR-PREMIUM-BUTTONS-V2 */
          :root{
            --bt3d-a:#8f82ff;--bt3d-b:#624de8;--bt3d-c:#34239f;
            --bt3d-p:#ff9bc7;--bt3d-q:#e85b9a;--bt3d-r:#ad285f;
            --bt3d-c1:#74e6ef;--bt3d-c2:#19b7c9;--bt3d-c3:#08788b;
            --bt3d-g1:#7ce9b5;--bt3d-g2:#21b573;--bt3d-g3:#08784a;
            --bt3d-o1:#ffd477;--bt3d-o2:#ff9d4d;--bt3d-o3:#c65b16;
          }
          .pbtn,.hxk,.fld,.hxc,.quick-grid button,.hxg button{
            position:relative!important;isolation:isolate!important;overflow:hidden!important;
            border:3px solid rgba(255,255,255,.88)!important;
            border-radius:24px!important;
            cursor:pointer!important;
            transform:translateY(0)!important;
            transition:transform .16s ease,filter .16s ease,box-shadow .16s ease!important;
            box-shadow:inset 0 2px 0 rgba(255,255,255,.62),inset 0 -7px 0 rgba(0,0,0,.16),0 7px 0 rgba(43,32,108,.24),0 15px 28px rgba(43,32,108,.16)!important;
          }
          .pbtn::before,.hxk::before,.fld::before,.hxc::before{
            content:""!important;position:absolute!important;left:8%!important;right:8%!important;top:7px!important;
            height:31%!important;border-radius:999px!important;
            background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,0))!important;
            pointer-events:none!important;z-index:0!important;
          }
          .pbtn::after,.hxk::after,.fld::after{
            content:""!important;position:absolute!important;left:0!important;right:0!important;top:0!important;height:55%!important;
            background:linear-gradient(180deg,rgba(255,255,255,.13),transparent)!important;pointer-events:none!important;z-index:0!important;
          }
          .pbtn:hover,.hxk:hover,.fld:hover,.hxc:hover,.quick-grid button:hover,.hxg button:hover{
            transform:translateY(-4px) scale(1.015)!important;filter:saturate(1.08) brightness(1.04)!important;
          }
          .pbtn:active,.hxk:active,.fld:active,.hxc:active,.quick-grid button:active,.hxg button:active{
            transform:translateY(4px) scale(.975)!important;
            box-shadow:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -3px 0 rgba(0,0,0,.15),0 2px 0 rgba(43,32,108,.22),0 7px 12px rgba(43,32,108,.12)!important;
          }
          .pbtn:nth-child(6n+1){background:linear-gradient(145deg,var(--bt3d-a),var(--bt3d-b) 55%,var(--bt3d-c))!important}
          .pbtn:nth-child(6n+2){background:linear-gradient(145deg,var(--bt3d-p),var(--bt3d-q) 55%,var(--bt3d-r))!important}
          .pbtn:nth-child(6n+3){background:linear-gradient(145deg,var(--bt3d-c1),var(--bt3d-c2) 55%,var(--bt3d-c3))!important}
          .pbtn:nth-child(6n+4){background:linear-gradient(145deg,var(--bt3d-g1),var(--bt3d-g2) 55%,var(--bt3d-g3))!important}
          .pbtn:nth-child(6n+5){background:linear-gradient(145deg,var(--bt3d-o1),var(--bt3d-o2) 55%,var(--bt3d-o3))!important}
          .pbtn:nth-child(6n){background:linear-gradient(145deg,#78b8ff,#2879d2 55%,#12509d)!important}
          .pbtn .pe,.pbtn strong,.pbtn small,.pbtn .pn{position:relative!important;z-index:2!important}
          .pbtn .pe{filter:drop-shadow(0 4px 2px rgba(0,0,0,.22))!important}
          .pbtn strong{font-weight:1000!important;text-shadow:0 2px 2px rgba(0,0,0,.38)!important}
          .pbtn small{font-weight:800!important;text-shadow:0 1px 2px rgba(0,0,0,.28)!important}
          .pbtn .pn,.hxk .sn{
            border:2px solid rgba(255,255,255,.9)!important;
            box-shadow:0 3px 8px rgba(0,0,0,.2)!important;
          }
          .hxk{
            background:linear-gradient(145deg,color-mix(in srgb,var(--k) 55%,#fff),var(--k) 55%,color-mix(in srgb,var(--k) 68%,#000))!important;
            min-height:170px!important;
          }
          .hxk i,.hxk strong{position:relative!important;z-index:2!important;text-shadow:0 3px 3px rgba(0,0,0,.38)!important}
          .hxk i{filter:drop-shadow(0 4px 2px rgba(0,0,0,.22))!important}
          .fld{
            background:linear-gradient(145deg,#ffffff,#eef2ff)!important;
            color:#26304a!important;
          }
          .fld strong,.fld small{position:relative!important;z-index:2!important}
          .quick-head h2,.hxt{filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
          @media(max-width:700px){
            .pbtn,.hxk,.fld,.hxc,.quick-grid button,.hxg button{border-radius:20px!important}
            .pbtn{min-height:150px!important}
            .hxk{min-height:145px!important}
          }
          </style>
          """
          s = s.replace("</head>", css + "\n</head>", 1)
          p.write_text(s, encoding="utf-8")
      - name: Commit themed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply Baby Tutor Premium Button Theme"
          git push
