<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ভয়েস — Baby Tutor</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,'Noto Sans Bengali','Noto Sans',sans-serif;background:linear-gradient(180deg,#eef9ff,#fff8ed);color:#263247}.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;background:#ffffffea;border-radius:22px;padding:11px 15px;box-shadow:0 8px 25px #0001;position:sticky;top:8px;z-index:20}.brand{font-weight:900;color:#b52e31;font-size:20px}.back{background:#b52e31;color:#fff;padding:9px 14px;border-radius:15px;font-weight:800}.hero{margin:15px 0;padding:28px 18px;border-radius:28px;text-align:center;color:#fff;background:linear-gradient(135deg,#b52e31,#e36a50,#f5b35b);box-shadow:0 14px 30px #0002}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px 0}.hero p{margin:0;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 9px 22px #0001;text-align:center;border:2px solid #fff}.big{font-size:45px}.card h3{margin:8px 0;color:#9a6500}.lesson{margin-top:18px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 9px 22px #0001}.letters{font-size:clamp(28px,6vw,48px);line-height:2.2;text-align:center;font-weight:800;color:#6a4be7}.btn{border:0;border-radius:15px;padding:11px 16px;background:#b52e31;color:#fff;font-weight:800;cursor:pointer;margin:4px}.soft{background:#fff2d9;color:#754d00}.footer{text-align:center;margin:28px 0;padding:22px;background:#fff;border-radius:22px;color:#718096}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{padding:13px}.letters{font-size:27px}}
</style><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="platform.css"><script src="platform.js" defer></script></head><body><main class="wrap"><header class="top"><div class="brand">🧸 Baby Tutor</div><a class="back" href="index.html">← হোম</a></header><section class="hero"><div>🔊 🎙️ ⭐</div><h1>শুনে শেখা</h1><p>শব্দ লিখে বা বাটনে চাপ দিয়ে শুনি</p></section><section class="lesson" style="text-align:center"><div class="big">🔊</div><input id="txt" value="আম, গাছ, পাখি, ফুল" style="width:90%;padding:14px;border-radius:15px;border:2px solid #ddd;font-size:18px"><br><button class="btn" onclick="speak(document.getElementById('txt').value)">▶️ শুনি</button><button class="btn soft" onclick="document.getElementById('txt').value=''">🧹 মুছি</button></section><section class="grid" style="margin-top:16px"><div class="card"><div class="big">🔊</div><h3>অ</h3><button class="btn" onclick="speak('অ')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>আ</h3><button class="btn" onclick="speak('আ')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>আম</h3><button class="btn" onclick="speak('আম')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>ইলিশ</h3><button class="btn" onclick="speak('ইলিশ')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>গাছ</h3><button class="btn" onclick="speak('গাছ')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>ফুল</h3><button class="btn" onclick="speak('ফুল')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>পাখি</h3><button class="btn" onclick="speak('পাখি')">শুনো</button></div><div class="card"><div class="big">🔊</div><h3>সংখ্যা</h3><button class="btn" onclick="speak('সংখ্যা')">শুনো</button></div></section><footer class="footer">🎧 ফোনের ভলিউম ঠিক রেখে শুনো</footer></main><script>function speak(t){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}</script></body></html>
