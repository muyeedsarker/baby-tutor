<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্বরবর্ণ — Baby Tutor</title><link rel="stylesheet" href="style.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali","Noto Sans",sans-serif;background:radial-gradient(circle at 15% 5%,#d9f7ff 0 12%,transparent 30%),linear-gradient(180deg,#eef9ff,#fff8ed);color:#263247}.wrap{max-width:1120px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;background:#ffffffee;border-radius:24px;padding:11px 15px;box-shadow:0 12px 30px #0002;position:sticky;top:7px;z-index:20;backdrop-filter:blur(10px)}.brand{font-weight:1000;color:#b52e31;font-size:20px}.back{background:linear-gradient(#e85b57,#a51f27);color:#fff;padding:10px 15px;border-radius:16px;font-weight:900;text-decoration:none;box-shadow:inset 0 2px 0 #ffffff66,0 6px 0 #7d1b20,0 10px 18px #0002}.hero{margin:15px 0;padding:30px 18px;border-radius:30px;text-align:center;color:#fff;background:linear-gradient(135deg,#c82f3b,#ef6b4f,#f7b84d);box-shadow:0 18px 35px #0002,inset 0 2px 0 #ffffff66;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:-80px auto auto -40px;width:180px;height:180px;border-radius:50%;background:#fff3;transform:rotate(20deg)}.hero h1{font-size:clamp(36px,7vw,60px);margin:8px 0;text-shadow:0 5px 0 #8f2530}.hero p{margin:0;font-size:17px;font-weight:800}.letters{background:linear-gradient(180deg,#fff,#f7f4ff);border-radius:24px;padding:13px;text-align:center;font-size:clamp(24px,5vw,44px);line-height:1.8;font-weight:1000;box-shadow:0 12px 28px #0002,inset 0 2px 0 #fff;margin-bottom:18px;border:1px solid #ffffff}.letters span{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;margin:4px;border-radius:18px;background:linear-gradient(145deg,#fff,#e7e1ff);color:#6a4be7;cursor:pointer;box-shadow:inset 0 2px 0 #fff,0 7px 0 #c9c0ef,0 12px 20px #0002;transition:.16s}.letters span:hover{transform:translateY(-3px)}.letters span:active{transform:translateY(4px);box-shadow:inset 0 2px 0 #fff,0 2px 0 #c9c0ef,0 6px 10px #0002}.grid{display:grid;grid-template-columns:1fr;max-width:620px;margin:0 auto;gap:18px}.grid .card{display:none}.grid .card.active{display:block;animation:slideIn .35s ease}.card{background:linear-gradient(145deg,#fff,#f8fbff);border-radius:28px;padding:12px;box-shadow:0 15px 32px #0002,inset 0 1px 0 #fff;border:2px solid #fff;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}.card:before{content:"";position:absolute;left:12px;right:12px;top:12px;height:55px;border-radius:20px;background:linear-gradient(180deg,#fff7,#fff0);pointer-events:none;z-index:2}.card:hover{transform:translateY(-7px) rotateX(1deg);box-shadow:0 24px 42px #0003}.pic{height:210px;border-radius:21px;overflow:hidden;background:linear-gradient(145deg,#e8f5ff,#fff);display:grid;place-items:center;box-shadow:inset 0 2px 0 #fff,0 8px 14px #0002;transform:translateZ(0)}.pic img{width:100%;height:100%;object-fit:cover;filter:saturate(1.12) contrast(1.03);transition:transform .25s}.card:hover .pic img{transform:scale(1.055)}.letter{font-size:62px;font-weight:1000;color:#b52e31;text-align:center;margin:5px 0 1px;text-shadow:0 5px 0 #f2c9c9,0 8px 15px #0002}.sentence{font-size:20px;line-height:1.55;font-weight:950;color:#263247;text-align:center;min-height:65px}.hint{text-align:center;color:#778196;font-size:12px;font-weight:800}.listen{display:block;margin:9px auto 3px;border:0;border-radius:15px;padding:11px 18px;background:linear-gradient(#fff5d8,#ffe6a5);color:#754d00;font-weight:950;cursor:pointer;box-shadow:0 5px 0 #d6b66a,0 9px 14px #0002}.listen:active{transform:translateY(3px);box-shadow:0 2px 0 #d6b66a}.screen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#fff,#eaf5ff 52%,#dcd5ff);display:none;place-items:center;text-align:center}.screen.show{display:grid;animation:pop .22s ease}.screen:before{content:"";position:absolute;width:70vw;height:70vw;max-width:650px;max-height:650px;border-radius:50%;background:#ffffff80;box-shadow:inset 0 0 70px #fff;filter:blur(2px)}.screen-letter{position:relative;font-size:clamp(180px,45vw,480px);line-height:.85;font-weight:1000;color:#b52e31;text-shadow:0 18px 0 #f0caca,0 25px 35px #0002;z-index:1}.screen-text{position:absolute;bottom:38px;left:15px;right:15px;font-size:22px;font-weight:950;color:#344054;z-index:2}.close{position:absolute;right:18px;top:18px;width:54px;height:54px;border:0;border-radius:50%;background:#fff;color:#b52e31;font-size:32px;font-weight:1000;box-shadow:0 8px 25px #0003;z-index:3}.footer{text-align:center;margin:25px 0;padding:20px;background:#fff;border-radius:24px;color:#718096;font-weight:750;box-shadow:0 10px 24px #0001}@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:9px;border-radius:22px}.pic{height:150px}.letter{font-size:48px}.sentence{font-size:16px;min-height:75px}.listen{font-size:12px;padding:9px 11px}.letters span{width:45px;height:45px;border-radius:14px;margin:3px}}
</style></head><body>
<div class="screen" id="screen"><button class="close" onclick="closeScreen()">×</button><div class="screen-letter" id="screenLetter">অ</div><div class="screen-text" id="screenText">অসুস্থ রোগীর সেবা করি</div></div>
<main class="wrap"><header class="top"><div class="brand">🧸 Baby Tutor</div><a class="back" href="index.html">← হোম</a></header>
<section class="hero"><div>☪️ 📖 🌙 ⭐</div><h1>স্বরবর্ণ</h1><p>স্বরবর্ণ শিখি — ইসলামি মূল্যবোধ ও সুন্দর কথার মাধ্যমে</p></section>
<section class="letters"><span onclick="showLetter('অ','')">অ</span><span onclick="showLetter('আ','')">আ</span><span onclick="showLetter('ই','')">ই</span><span onclick="showLetter('ঈ','')">ঈ</span><span onclick="showLetter('উ','')">উ</span><span onclick="showLetter('ঊ','')">ঊ</span><span onclick="showLetter('ঋ','')">ঋ</span><span onclick="showLetter('এ','')">এ</span><span onclick="showLetter('ঐ','')">ঐ</span><span onclick="showLetter('ও','')">ও</span><span onclick="showLetter('ঔ','')">ঔ</span></section>
<section class="grid" id="grid"></section><footer class="footer">🌟 অক্ষরে চাপ দাও • বড় করে দেখো • সুন্দর কথাটি শোনো • ভালো কাজ শিখো</footer></main>
<script>
const DATA=[['অ','অসুস্থ রোগীর সেবা করি','https://commons.wikimedia.org/wiki/Special:FilePath/Hospital%20patient%20on%20floor.jpg?width=900'],['আ','আল্লাহ আমাদের সৃষ্টিকর্তা','https://commons.wikimedia.org/wiki/Special:FilePath/Allah%20in%20Islamic%20calligraphy.png?width=900'],['ই','ইসলাম আমাদের সুন্দর জীবন শেখায়','https://commons.wikimedia.org/wiki/Special:FilePath/MosqueeEnfant.jpg?width=900'],['ঈ','ঈমান আমাদের হৃদয়ের আলো','https://commons.wikimedia.org/wiki/Special:FilePath/A%20child%20learning%20how%20write%20in%20Quran.jpg?width=900'],['উ','উত্তম চরিত্রের অধিকারী হই','https://commons.wikimedia.org/wiki/Special:FilePath/Kids%20playing%20in%20mosque.jpg?width=900'],['ঊ','ঊষার সময় আল্লাহর শুকরিয়া করি','https://commons.wikimedia.org/wiki/Special:FilePath/Mosque%20in%20Bangladesh.jpg?width=900'],['ঋ','ঋণ সময়মতো পরিশোধ করি','https://commons.wikimedia.org/wiki/Special:FilePath/Allah%20in%20Islamic%20calligraphy.png?width=900'],['এ','এক আল্লাহর ইবাদত করি','https://commons.wikimedia.org/wiki/Special:FilePath/The%20muslim%20prayer.jpg?width=900'],['ঐ','ঐক্য ও ভ্রাতৃত্ব বজায় রাখি','https://commons.wikimedia.org/wiki/Special:FilePath/MosqueeEnfant.jpg?width=900'],['ও','ওযু করে নামাজ পড়ি','https://commons.wikimedia.org/wiki/Special:FilePath/Wudu%20(Wuju).jpg?width=900'],['ঔ','ঔষধ গ্রহণ করি, আল্লাহর কাছে শিফা চাই','https://commons.wikimedia.org/wiki/Special:FilePath/Medicine.jpg?width=900']];
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.78;speechSynthesis.speak(u)}
function showLetter(l,t){document.getElementById('screenLetter').textContent=l;document.getElementById('screenText').textContent=t||'অক্ষরটি দেখো ও উচ্চারণ করো';document.getElementById('screen').classList.add('show');speak(l);clearTimeout(window.timer);if(t)window.timer=setTimeout(()=>speak(t),650)}
function closeScreen(){document.getElementById('screen').classList.remove('show');speechSynthesis.cancel()}
document.getElementById('grid').innerHTML=DATA.map((d,i)=>`<article class="card ${i===0?"active":""}" onclick="showLetter('${d[0]}','${d[1]}')"><div class="pic"><img src="${d[2]}" alt="${d[1]}" loading="lazy"></div><div class="letter">${d[0]}</div><div class="sentence">${d[1]}</div><div class="hint">অক্ষরে চাপ দিলে বড় হয়ে দেখাবে</div><button class="listen" type="button" onclick="event.stopPropagation();speak('${d[0]} — ${d[1]}')">🔊 শুনি</button></article>`).join('');
function selectLetter(i){i=(i+DATA.length)%DATA.length;document.querySelectorAll('#grid .card').forEach((el,n)=>el.classList.toggle('active',n===i));document.querySelectorAll('.letters span').forEach((el,n)=>el.classList.toggle('selected',n===i));showLetter(DATA[i][0],DATA[i][1])}
function nextLetter(){let i=DATA.findIndex(d=>d[0]===document.getElementById('screenLetter').textContent);selectLetter(i+1)}
function prevLetter(){let i=DATA.findIndex(d=>d[0]===document.getElementById('screenLetter').textContent);selectLetter(i-1)}
</script><style>
.gridNav{display:flex;justify-content:center;gap:12px;margin:14px auto 4px}.navBtn{border:0;border-radius:17px;padding:12px 22px;font-weight:950;background:linear-gradient(#fff,#e9e3ff);box-shadow:0 5px 0 #c8bfea,0 10px 18px #0002;cursor:pointer;color:#5b45b8}.navBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c8bfea}.letters span.selected{background:linear-gradient(145deg,#ffef86,#ffc83d);color:#8a4d00;box-shadow:inset 0 2px 0 #fff,0 7px 0 #d89d22,0 12px 20px #0002}.grid .card.active{display:block}@keyframes slideIn{from{opacity:0;transform:translateX(35px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}@media(max-width:500px){.grid{grid-template-columns:1fr;max-width:100%}}
</style><script>
document.querySelectorAll('.letters span').forEach((el,i)=>el.setAttribute('onclick',`selectLetter(${i})`));
const nav=document.createElement('div');nav.className='gridNav';nav.innerHTML='<button class="navBtn" onclick="prevLetter()">← আগের</button><button class="navBtn" onclick="nextLetter()">পরের →</button>';document.getElementById('grid').after(nav);
document.querySelector('.letters span').classList.add('selected');
</script></body></html>
