<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>স্বরবর্ণ — Baby Tutor</title><link rel="stylesheet" href="style.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali","Noto Sans",sans-serif;background:linear-gradient(180deg,#eef9ff,#fff8ed);color:#263247}.wrap{max-width:1120px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;background:#ffffffec;border-radius:22px;padding:11px 15px;box-shadow:0 8px 25px #0001;position:sticky;top:7px;z-index:20}.brand{font-weight:1000;color:#b52e31;font-size:20px}.back{background:#b52e31;color:#fff;padding:9px 14px;border-radius:15px;font-weight:900;text-decoration:none}.hero{margin:15px 0;padding:28px 18px;border-radius:28px;text-align:center;color:#fff;background:linear-gradient(135deg,#b52e31,#e36a50,#f5b35b);box-shadow:0 14px 30px #0002}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px 0}.hero p{margin:0;font-size:17px;font-weight:750}.letters{background:#fff;border-radius:22px;padding:13px;text-align:center;font-size:clamp(24px,5vw,44px);line-height:1.8;font-weight:1000;color:#6a4be7;box-shadow:0 8px 22px #0001;margin-bottom:18px}.letters span{display:inline-block;padding:0 8px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:25px;padding:13px;box-shadow:0 12px 28px #00000012;border:2px solid #fff;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px)}.pic{height:210px;border-radius:19px;overflow:hidden;background:#f3f6ff;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:cover}.letter{font-size:58px;font-weight:1000;color:#b52e31;text-align:center;margin:5px 0}.sentence{font-size:20px;line-height:1.55;font-weight:950;color:#263247;text-align:center;min-height:65px}.hint{text-align:center;color:#778196;font-size:12px;font-weight:800}.listen{display:block;margin:9px auto 2px;border:0;border-radius:14px;padding:10px 16px;background:#fff2d9;color:#754d00;font-weight:950;cursor:pointer}.screen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#fff,#f1efff 58%,#e6e1ff);display:none;place-items:center;text-align:center}.screen.show{display:grid;animation:pop .22s ease}.screen-letter{font-size:clamp(180px,45vw,480px);line-height:.85;font-weight:1000;color:#b52e31;text-shadow:0 18px 0 #f0caca}.screen-text{position:absolute;bottom:38px;left:15px;right:15px;font-size:22px;font-weight:950;color:#344054}.close{position:absolute;right:18px;top:18px;width:54px;height:54px;border:0;border-radius:50%;background:#fff;color:#b52e31;font-size:32px;font-weight:1000;box-shadow:0 8px 25px #0002}.footer{text-align:center;margin:25px 0;padding:20px;background:#fff;border-radius:22px;color:#718096;font-weight:750}@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:9px;border-radius:20px}.pic{height:150px}.letter{font-size:48px}.sentence{font-size:16px;min-height:75px}.listen{font-size:12px;padding:9px 11px}}
</style></head><body>
<div class="screen" id="screen"><button class="close" onclick="closeScreen()">×</button><div class="screen-letter" id="screenLetter">অ</div><div class="screen-text" id="screenText">অসুস্থ রোগীর সেবা করি</div></div>
<main class="wrap"><header class="top"><div class="brand">🧸 Baby Tutor</div><a class="back" href="index.html">← হোম</a></header>
<section class="hero"><div>☪️ 📖 🌙</div><h1>স্বরবর্ণ</h1><p>স্বরবর্ণ শিখি — ইসলামি মূল্যবোধ ও সুন্দর কথার মাধ্যমে</p></section>
<section class="letters"><span onclick="showLetter('অ','')">অ</span><span onclick="showLetter('আ','')">আ</span><span onclick="showLetter('ই','')">ই</span><span onclick="showLetter('ঈ','')">ঈ</span><span onclick="showLetter('উ','')">উ</span><span onclick="showLetter('ঊ','')">ঊ</span><span onclick="showLetter('ঋ','')">ঋ</span><span onclick="showLetter('এ','')">এ</span><span onclick="showLetter('ঐ','')">ঐ</span><span onclick="showLetter('ও','')">ও</span><span onclick="showLetter('ঔ','')">ঔ</span></section>
<section class="grid" id="grid"></section>
<footer class="footer">🌟 অক্ষরে চাপ দাও • বড় করে দেখো • সুন্দর কথাটি শোনো • ভালো কাজ শিখো</footer></main>
<script>
const DATA=[
['অ','অসুস্থ রোগীর সেবা করি','https://commons.wikimedia.org/wiki/Special:FilePath/Hospital%20patient%20on%20floor.jpg?width=900'],
['আ','আল্লাহ আমাদের সৃষ্টিকর্তা','https://commons.wikimedia.org/wiki/Special:FilePath/Allah%20in%20Islamic%20calligraphy.png?width=900'],
['ই','ইসলাম আমাদের সুন্দর জীবন শেখায়','https://commons.wikimedia.org/wiki/Special:FilePath/MosqueeEnfant.jpg?width=900'],
['ঈ','ঈমান আমাদের হৃদয়ের আলো','https://commons.wikimedia.org/wiki/Special:FilePath/A%20child%20learning%20how%20write%20in%20Quran.jpg?width=900'],
['উ','উত্তম চরিত্রের অধিকারী হই','https://commons.wikimedia.org/wiki/Special:FilePath/Kids%20playing%20in%20mosque.jpg?width=900'],
['ঊ','ঊষার সময় আল্লাহর শুকরিয়া করি','https://commons.wikimedia.org/wiki/Special:FilePath/Mosque%20in%20Bangladesh.jpg?width=900'],
['ঋ','ঋণ সময়মতো পরিশোধ করি','https://commons.wikimedia.org/wiki/Special:FilePath/Allah%20in%20Islamic%20calligraphy.png?width=900'],
['এ','এক আল্লাহর ইবাদত করি','https://commons.wikimedia.org/wiki/Special:FilePath/The%20muslim%20prayer.jpg?width=900'],
['ঐ','ঐক্য ও ভ্রাতৃত্ব বজায় রাখি','https://commons.wikimedia.org/wiki/Special:FilePath/MosqueeEnfant.jpg?width=900'],
['ও','ওযু করে নামাজ পড়ি','https://commons.wikimedia.org/wiki/Special:FilePath/Wudu%20(Wuju).jpg?width=900'],
['ঔ','ঔষধ গ্রহণ করি, আল্লাহর কাছে শিফা চাই','https://commons.wikimedia.org/wiki/Special:FilePath/Medicine.jpg?width=900']
];
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.78;speechSynthesis.speak(u)}
function showLetter(l,t){document.getElementById('screenLetter').textContent=l;document.getElementById('screenText').textContent=t||'অক্ষরটি দেখো ও উচ্চারণ করো';document.getElementById('screen').classList.add('show');speak(l);clearTimeout(window.timer);if(t)window.timer=setTimeout(()=>{speak(t)},650)}
function closeScreen(){document.getElementById('screen').classList.remove('show')}
document.getElementById('grid').innerHTML=DATA.map(d=>`<article class="card" onclick="showLetter('${d[0]}','${d[1]}')"><div class="pic"><img src="${d[2]}" alt="${d[1]}" loading="lazy"></div><div class="letter">${d[0]}</div><div class="sentence">${d[1]}</div><div class="hint">অক্ষরে চাপ দিলে বড় হয়ে দেখাবে</div><button class="listen" type="button" onclick="event.stopPropagation();speak('${d[0]} — ${d[1]}')">🔊 শুনি</button></article>`).join('');
</script></body></html>
