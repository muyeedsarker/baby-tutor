<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ব্যঞ্জনবর্ণ — Baby Tutor</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,'Noto Sans Bengali','Noto Sans',sans-serif;background:linear-gradient(180deg,#eef9ff,#fff8ed);color:#263247}.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;background:#ffffffea;border-radius:22px;padding:11px 15px;box-shadow:0 8px 25px #0001;position:sticky;top:8px;z-index:20}.brand{font-weight:900;color:#b52e31;font-size:20px}.back{background:#b52e31;color:#fff;padding:9px 14px;border-radius:15px;font-weight:800}.hero{margin:15px 0;padding:28px 18px;border-radius:28px;text-align:center;color:#fff;background:linear-gradient(135deg,#b52e31,#e36a50,#f5b35b);box-shadow:0 14px 30px #0002}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px 0}.hero p{margin:0;font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 9px 22px #0001;text-align:center;border:2px solid #fff}.big{font-size:45px}.card h3{margin:8px 0;color:#9a6500}.lesson{margin-top:18px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 9px 22px #0001}.letters{font-size:clamp(28px,6vw,48px);line-height:2.2;text-align:center;font-weight:800;color:#6a4be7}.btn{border:0;border-radius:15px;padding:11px 16px;background:#b52e31;color:#fff;font-weight:800;cursor:pointer;margin:4px}.soft{background:#fff2d9;color:#754d00}.footer{text-align:center;margin:28px 0;padding:22px;background:#fff;border-radius:22px;color:#718096}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.card{padding:13px}.letters{font-size:27px}}
</style><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header class="top"><div class="brand">🧸 Baby Tutor</div><a class="back" href="index.html">← হোম</a></header><section class="hero"><div>📝 🌳 🐦</div><h1>ব্যঞ্জনবর্ণ</h1><p>অক্ষর চিনে শব্দ বানাই</p></section><section class="grid"><div class="card"><div class="big">ক</div><h3>কলম</h3><button class="btn soft" onclick="speak('ক')">🔊 বলি</button></div><div class="card"><div class="big">খ</div><h3>খেলা</h3><button class="btn soft" onclick="speak('খ')">🔊 বলি</button></div><div class="card"><div class="big">গ</div><h3>গাছ</h3><button class="btn soft" onclick="speak('গ')">🔊 বলি</button></div><div class="card"><div class="big">ঘ</div><h3>ঘড়ি</h3><button class="btn soft" onclick="speak('ঘ')">🔊 বলি</button></div><div class="card"><div class="big">ঙ</div><h3>ঙ</h3><button class="btn soft" onclick="speak('ঙ')">🔊 বলি</button></div><div class="card"><div class="big">চ</div><h3>চাঁদ</h3><button class="btn soft" onclick="speak('চ')">🔊 বলি</button></div><div class="card"><div class="big">ছ</div><h3>ছাতা</h3><button class="btn soft" onclick="speak('ছ')">🔊 বলি</button></div><div class="card"><div class="big">জ</div><h3>জল</h3><button class="btn soft" onclick="speak('জ')">🔊 বলি</button></div><div class="card"><div class="big">ঝ</div><h3>ঝিনুক</h3><button class="btn soft" onclick="speak('ঝ')">🔊 বলি</button></div><div class="card"><div class="big">ঞ</div><h3>ঞ</h3><button class="btn soft" onclick="speak('ঞ')">🔊 বলি</button></div><div class="card"><div class="big">ট</div><h3>টব</h3><button class="btn soft" onclick="speak('ট')">🔊 বলি</button></div><div class="card"><div class="big">ঠ</div><h3>ঠেলা</h3><button class="btn soft" onclick="speak('ঠ')">🔊 বলি</button></div></section><div class="lesson"><h2>🎯 অনুশীলন</h2><p style="font-size:21px">ক + লম = কলম ✏️<br>গ + াছ = গাছ 🌳<br>ছ + াতা = ছাতা ☂️</p></div><footer class="footer">💡 অক্ষর মিলিয়ে শব্দ বানানো শেখি</footer></main><script>function speak(t){let u=new SpeechSyn
