function speak(t){const u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';speechSynthesis.cancel();speechSynthesis.speak(u)}
function openScreen(letter,text){document.getElementById('screenLetter').textContent=letter;document.getElementById('screenText').textContent=text;document.getElementById('screen').classList.add('show');speak(letter);setTimeout(()=>speak(text),650)}
function closeScreen(){document.getElementById('screen').classList.remove('show');speechSynthesis.cancel()}

function selectConsonant(i){i=(i+items.length)%items.length;document.querySelectorAll('#grid .card').forEach((el,n)=>el.classList.toggle('active',n===i));document.querySelectorAll('.letters span').forEach((el,n)=>el.classList.toggle('selected',n===i));openScreen(items[i][0],items[i][1])}
